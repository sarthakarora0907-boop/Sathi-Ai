<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wetRoad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="waterBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
  </defs>

  <!-- Wet road surface -->
  <rect width="600" height="400" fill="url(#wetRoad)" />

  <!-- Road divider curbs -->
  <rect x="0" y="360" width="600" height="40" fill="#334155" />
  <rect x="100" y="365" width="80" height="15" fill="#facc15" />
  <rect x="300" y="365" width="80" height="15" fill="#facc15" />
  <rect x="500" y="365" width="80" height="15" fill="#facc15" />

  <!-- Large flooded water surface with ripples -->
  <ellipse cx="300" cy="260" rx="260" ry="90" fill="#0284c7" opacity="0.35" />
  <ellipse cx="300" cy="260" rx="200" ry="60" fill="#38bdf8" opacity="0.45" />
  <ellipse cx="300" cy="260" rx="120" ry="35" fill="#7dd3fc" opacity="0.55" />

  <!-- Burst Pipeline Geyser / Jet -->
  <path d="M 270 260 Q 250 140 280 80 Q 300 40 310 80 Q 330 140 330 260 Z" fill="url(#waterBurst)" opacity="0.85" />
  <!-- Water Spray & Splashes -->
  <circle cx="270" cy="70" r="14" fill="#e0f2fe" opacity="0.9" />
  <circle cx="320" cy="65" r="16" fill="#e0f2fe" opacity="0.9" />
  <circle cx="295" cy="50" r="12" fill="#ffffff" />
  <circle cx="230" cy="110" r="10" fill="#38bdf8" />
  <circle cx="360" cy="110" r="11" fill="#38bdf8" />
  <circle cx="210" cy="160" r="8" fill="#7dd3fc" />
  <circle cx="380" cy="170" r="9" fill="#7dd3fc" />

  <!-- Ruptured tarmac around pipe -->
  <polygon points="250,250 270,240 320,245 350,265 310,275 260,270" fill="#020617" />

  <!-- Evidence Tag Overlay -->
  <rect x="20" y="20" width="230" height="48" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
  <circle cx="38" cy="44" r="6" fill="#0284c7" />
  <text x="54" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">SAMPLE EVIDENCE</text>
  <text x="54" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Katraj-Kondhwa (Underground Rupture)</text>
</svg>
