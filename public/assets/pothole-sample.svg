<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="asphalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="potholeDepth" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#182030" />
      <stop offset="85%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
    <pattern id="roadTexture" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#475569" opacity="0.3" />
      <circle cx="12" cy="8" r="1.5" fill="#1e293b" opacity="0.4" />
      <circle cx="7" cy="15" r="1" fill="#64748b" opacity="0.2" />
    </pattern>
  </defs>

  <!-- Asphalt Road Surface -->
  <rect width="600" height="400" fill="url(#asphalt)" />
  <rect width="600" height="400" fill="url(#roadTexture)" />

  <!-- Road White Lane Marking -->
  <rect x="520" y="0" width="12" height="120" fill="#f8fafc" opacity="0.7" />
  <rect x="520" y="160" width="12" height="120" fill="#f8fafc" opacity="0.7" />
  <rect x="520" y="320" width="12" height="120" fill="#f8fafc" opacity="0.7" />

  <!-- Deep Crater / Pothole Body -->
  <ellipse cx="280" cy="220" rx="180" ry="110" fill="url(#potholeDepth)" />
  
  <!-- Jagged Edge Breakdown -->
  <path d="M 120 200 Q 150 170 210 160 Q 280 140 370 160 Q 430 180 460 220 Q 450 280 390 310 Q 300 340 210 320 Q 130 300 110 240 Z" fill="#0f172a" opacity="0.9" />
  
  <!-- Exposed Aggregate & Cracks -->
  <path d="M 210 160 L 170 120 M 370 160 L 410 110 M 460 220 L 510 250 M 210 320 L 160 360" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <circle cx="230" cy="210" r="18" fill="#020617" />
  <circle cx="320" cy="240" r="24" fill="#020617" />
  <circle cx="280" cy="270" r="14" fill="#020617" />

  <!-- Stagnant Rain Water Puddle inside Pothole -->
  <ellipse cx="270" cy="235" rx="85" ry="40" fill="#38bdf8" opacity="0.35" />
  <path d="M 230 230 Q 270 225 310 230" stroke="#e0f2fe" stroke-width="1.5" fill="none" opacity="0.8" />

  <!-- Evidence Tag Overlay -->
  <rect x="20" y="20" width="220" height="48" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
  <circle cx="38" cy="44" r="6" fill="#ef4444" />
  <text x="54" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">SAMPLE EVIDENCE</text>
  <text x="54" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Karve Rd / Nal Stop (Depth: ~5 in)</text>
</svg>
