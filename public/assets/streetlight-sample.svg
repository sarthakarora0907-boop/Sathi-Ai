<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Night sky & road -->
  <rect width="600" height="320" fill="url(#nightSky)" />
  <rect y="320" width="600" height="80" fill="#090d16" />

  <!-- Streetlight Pole -->
  <path d="M 280 400 L 290 80 Q 290 40 330 35 L 420 35" stroke="#64748b" stroke-width="14" stroke-linecap="round" fill="none" />
  
  <!-- Dead Lamp Fixture -->
  <path d="M 400 35 L 450 48 L 415 65 Z" fill="#475569" stroke="#334155" stroke-width="2" />
  <!-- Broken red cross on lamp -->
  <circle cx="430" cy="50" r="16" fill="#ef4444" opacity="0.3" />
  <path d="M 422 42 L 438 58 M 438 42 L 422 58" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />

  <!-- Dangling wire with sparks -->
  <path d="M 380 45 Q 360 110 390 160 Q 420 210 370 270" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="4,4" />
  <!-- Danger electrical symbol -->
  <polygon points="370,270 385,285 375,290 388,310 365,292 375,288" fill="#eab308" />

  <!-- Distant dark city silhouette -->
  <rect x="40" y="240" width="60" height="80" fill="#0f172a" />
  <rect x="120" y="210" width="70" height="110" fill="#0f172a" />
  <rect x="470" y="220" width="80" height="100" fill="#0f172a" />

  <!-- Evidence Tag Overlay -->
  <rect x="20" y="20" width="230" height="48" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
  <circle cx="38" cy="44" r="6" fill="#eab308" />
  <text x="54" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">SAMPLE EVIDENCE</text>
  <text x="54" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Baner High St (Blackout &amp; Loose Wire)</text>
</svg>
