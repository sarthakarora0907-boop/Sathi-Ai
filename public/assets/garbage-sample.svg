<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <!-- Background wall and road -->
  <rect width="600" height="260" fill="url(#bg)" />
  <rect y="260" width="600" height="140" fill="#475569" />

  <!-- Municipal Green Dustbin -->
  <path d="M 180 180 L 210 320 L 390 320 L 420 180 Z" fill="url(#binGrad)" stroke="#052e16" stroke-width="3" />
  <rect x="160" y="165" width="280" height="20" rx="6" fill="#14532d" />
  <text x="300" y="255" text-anchor="middle" fill="#dcfce7" font-family="sans-serif" font-weight="900" font-size="22" letter-spacing="3">PMC SWACHH</text>

  <!-- Overflowing garbage piles -->
  <path d="M 150 170 Q 220 90 300 110 Q 380 90 450 170 Z" fill="#78350f" opacity="0.8" />
  <!-- Discarded plastic bags & bottles -->
  <ellipse cx="230" cy="140" rx="35" ry="25" fill="#0284c7" />
  <ellipse cx="320" cy="120" rx="40" ry="30" fill="#dc2626" />
  <ellipse cx="370" cy="145" rx="35" ry="22" fill="#ca8a04" />
  <ellipse cx="280" cy="145" rx="30" ry="20" fill="#e2e8f0" />

  <!-- Spilled trash on pavement -->
  <path d="M 120 340 C 180 300 420 300 480 340 C 510 370 100 380 120 340 Z" fill="#b45309" opacity="0.7" />
  <rect x="140" y="330" width="45" height="25" rx="5" fill="#facc15" transform="rotate(15 140 330)" />
  <rect x="230" y="340" width="55" height="20" rx="4" fill="#38bdf8" transform="rotate(-10 230 340)" />
  <circle cx="370" cy="350" r="14" fill="#ef4444" />
  <circle cx="430" cy="345" r="18" fill="#f8fafc" />

  <!-- Evidence Tag Overlay -->
  <rect x="20" y="20" width="230" height="48" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
  <circle cx="38" cy="44" r="6" fill="#f59e0b" />
  <text x="54" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">SAMPLE EVIDENCE</text>
  <text x="54" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Viman Nagar (Overflowing >48 hrs)</text>
</svg>
